<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">India demographic risk and population forecasting workflow</title><desc id="desc">UN WPP data flows through quality checks, demographic features, risk indices, forecasting, evaluation and policy interpretation.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#476581"/></marker><style>.title{font:700 28px Arial,sans-serif;fill:#14283f}.subtitle{font:16px Arial,sans-serif;fill:#476581}.box{stroke-width:2;rx:16;ry:16}.h{font:700 18px Arial,sans-serif;fill:#14283f}.t{font:15px Arial,sans-serif;fill:#263c52}.arrow{stroke:#476581;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="900" fill="#f6f9fc"/><text x="600" y="48" text-anchor="middle" class="title">India Demographic Risk &amp; Population Forecasting</text><text x="600" y="76" text-anchor="middle" class="subtitle">Reproducible analysis workflow • UN World Population Prospects 2024</text>
<rect class="box" x="250" y="105" width="700" height="92" fill="#e4f1ff" stroke="#75a9db"/><text x="600" y="137" text-anchor="middle" class="h">1. Data inputs</text><text x="600" y="163" text-anchor="middle" class="t">Demographic indicators • population by 5-year age group and sex</text><text x="600" y="184" text-anchor="middle" class="t">Separate source estimates, UN projections, and model forecasts</text>
<path class="arrow" d="M600 197 V225"/><rect class="box" x="250" y="230" width="700" height="90" fill="#e7f7ef" stroke="#70b99a"/><text x="600" y="261" text-anchor="middle" class="h">2. Data quality &amp; preparation</text><text x="600" y="286" text-anchor="middle" class="t">Select India • verify years and units • handle missing values • check duplicates</text><text x="600" y="306" text-anchor="middle" class="t">Validate age-group totals and use documented joins</text>
<path class="arrow" d="M600 320 V348"/><rect class="box" x="250" y="353" width="700" height="90" fill="#fff2d9" stroke="#d9a94c"/><text x="600" y="384" text-anchor="middle" class="h">3. Demographic feature engineering</text><text x="600" y="409" text-anchor="middle" class="t">Young (0–14) • working age (15–64) • older (65+) population</text><text x="600" y="429" text-anchor="middle" class="t">Shares, growth, median age, fertility, mortality, dependency ratio</text>
<path class="arrow" d="M600 443 V465 H205 V489"/><path class="arrow" d="M600 465 V489"/><path class="arrow" d="M600 465 H995 V489"/>
<rect class="box" x="45" y="495" width="320" height="115" fill="#f0eaff" stroke="#a18ad8"/><text x="205" y="526" text-anchor="middle" class="h">4A. Risk indices</text><text x="205" y="552" text-anchor="middle" class="t">Aging • workforce • population pressure</text><text x="205" y="575" text-anchor="middle" class="t">Composite score</text><text x="205" y="596" text-anchor="middle" class="t">Document scaling and weights</text>
<rect class="box" x="440" y="495" width="320" height="115" fill="#e3f5f7" stroke="#6bbac3"/><text x="600" y="526" text-anchor="middle" class="h">4B. Forecast models</text><text x="600" y="552" text-anchor="middle" class="t">Baseline • Prophet</text><text x="600" y="575" text-anchor="middle" class="t">Random Forest • age-structure variant</text><text x="600" y="596" text-anchor="middle" class="t">Fit on past years only</text>
<rect class="box" x="835" y="495" width="320" height="115" fill="#ffebeb" stroke="#db9292"/><text x="995" y="526" text-anchor="middle" class="h">4C. Exploratory analysis</text><text x="995" y="552" text-anchor="middle" class="t">Trends and age structure</text><text x="995" y="575" text-anchor="middle" class="t">Visualize transitions and uncertainty</text><text x="995" y="596" text-anchor="middle" class="t">Avoid causal claims from trends alone</text>
<path class="arrow" d="M205 610 V644 H600 V660"/><path class="arrow" d="M600 610 V660"/><path class="arrow" d="M995 610 V644 H600"/><rect class="box" x="250" y="665" width="700" height="90" fill="#e4f1ff" stroke="#75a9db"/><text x="600" y="696" text-anchor="middle" class="h">5. Evaluation &amp; robustness checks</text><text x="600" y="721" text-anchor="middle" class="t">Chronological / rolling-origin validation • MAE, RMSE • baseline comparison</text><text x="600" y="741" text-anchor="middle" class="t">Check leakage, residuals, sensitivity, and comparable test periods</text>
<path class="arrow" d="M600 755 V782"/><rect class="box" x="250" y="787" width="700" height="78" fill="#e7f7ef" stroke="#70b99a"/><text x="600" y="817" text-anchor="middle" class="h">6. Interpretation &amp; reporting</text><text x="600" y="841" text-anchor="middle" class="t">State assumptions, limitations, uncertainty, and policy implications</text></svg>